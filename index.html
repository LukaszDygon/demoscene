<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Demo Screening Room</title>
<link rel=icon type="image/svg+xml" href="favicon.svg">
<style>
:root{--bg:#0c0a12;--card:#161320;--fg:#eee;--mut:#9a93ad;--acc:#ff71ce;--link:#7ff;--line:#2a2438}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,system-ui,sans-serif;padding:24px 16px}
main{max-width:1500px;margin:0 auto}
h1{font-size:20px;margin:0}p.s{color:var(--mut);margin:4px 0 16px}
.filters{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin:0 0 20px;font-size:13px;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-left:6px}
.seg button{background:none;border:0;color:var(--fg);font:inherit;padding:6px 12px;cursor:pointer;min-height:36px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--acc);color:#1a0d17;font-weight:600}
#count{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:16px}
.card{display:block;background:var(--card);border-radius:8px;padding:12px;color:inherit;text-decoration:none;transition:background .15s}
.card[hidden]{display:none}
.card:hover,.card:focus-visible{background:#1f1a2c}.card:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.card video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;border-radius:4px;margin-bottom:10px}
.card h2{font-size:16px;margin:0;color:var(--acc)}
.meta{color:var(--mut);font-size:12px;margin:2px 0 0}
.brief{font-size:13px;color:var(--mut);margin:6px 0 0}
</style></head><body><main>
<h1>Demo Screening Room</h1>
<p class=s>Size-coded browser intros. Pick one to open it, then click its start screen to play with sound.</p>
<div class=filters>
 <span>Size<span class=seg data-f=size><button data-v="">All</button><button data-v=16k>16k</button><button data-v=64k>64k</button></span></span>
 <span>Built by<span class=seg data-f=agent><button data-v="">All</button><button data-v=opus-5.5-high>Opus 5.5 · high</button><button data-v=opus-5.5-medium>Opus 5.5 · medium</button><button data-v=haiku-5.5-medium>Haiku 5.5 · medium</button></span></span>
 <span id=count></span>
</div>
<div class=grid id=g></div>
</main><script>
// Add a demo: one line here (title, shipped file, budget · size, brief). Paths are relative to this page.
// Its preview is demos/<folder>/thumb.webm (VP8) and thumb.mp4 (H.264), with thumb.png as the poster (record them with: node tools/thumbs.mjs <folder>).
// The agent comes from the file name's label: <name>.<model>-<effort>.html.
const DEMOS=[
 ['ＶＡＰＯＲ ＭＡＬＬ','demos/vapor-mall/dist/vapor-mall.opus-5.5-medium.html','64k · 49 KB','An FPV drone flight through a 3 a.m. dream mall of floating consumer goods, into the breast pocket of a smiling giant with very gelled hair.'],
 ['Descensus','demos/descensus/dist/descensus.opus-5.5-high.html','64k · 30 KB','A slow descent into the deep sea: jellyfish, a whale, a sunken cathedral lit by an anglerfish.'],
 ['KAIJU','demos/kaiju-16k/dist/kaiju-16k.opus-5.5-medium.html','16k · 16 KB','A low race through a neon city at night that ends face to face with a giant monster breathing fire into a holographic KAIJU logo.'],
 ['INK & STEEL','demos/ink-and-steel-16k/dist/ink-and-steel-16k.haiku-5.5-medium.html','16k · 13 KB','A rainy rooftop sword duel painted in sumi-e ink, with every clash splashing across the paper.'],
 ['KA-BOOM!','demos/ka-boom-16k/dist/ka-boom-16k.haiku-5.5-medium.html','16k · 14 KB',"Pure kinetic typography: Swiss-poster words colliding to a 174 BPM drum'n'bass break."],
 ['THE TAPESTRY','demos/the-tapestry-64k/dist/the-tapestry-64k.opus-5.5-medium.html','64k · 45 KB','A medieval siege embroidered on a tapestry that comes alive, dragon fire burning through the cloth.'],
 ['THE MEADOW COUNTS','demos/meadow-counts-64k/dist/meadow-counts-64k.opus-5.5-medium.html','64k · 47 KB','A half-remembered 70s school film: sunflowers of sunflowers, honeycomb rising into basalt, a horizon that folds into the sky, to dusty 88 BPM boom-bap.'],
 ['RECURSOR','demos/recursor-64k/dist/recursor-64k.opus-5.5-medium.html','64k · 42 KB','A manic 170 BPM acid fall through nested tesseracts, a Menger descent and hyperbolic honeycombs, called out by a crushed machine voice.'],
 ['PLEASE ASSEMBLE','demos/please-assemble-64k/dist/please-assemble-64k.opus-5.5-medium.html','64k · 47 KB',"A too-cheerful announcer walks you through assembling Penrose stairs, Necker cubes and a Möbius ribbon on graph paper, in 7/8 and 5/4."]];
const AGENT={'opus-5.5-high':'Opus 5.5 · high','opus-5.5-medium':'Opus 5.5 · medium','haiku-5.5-medium':'Haiku 5.5 · medium'};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
// VP8 WebM is decoded in software, which sidesteps flaky hardware VP9 decoders; H.264 MP4 covers browsers without WebM (older Safari, iPhone).
const ext=document.createElement('video').canPlayType('video/webm; codecs="vp8"')?'webm':'mp4';
const g=document.getElementById('g');
// Browsers (phones especially) only have a handful of video decoders, so a clip gets its source while its card
// is near the screen and gives it back once it scrolls away (the poster shows meanwhile).
const near=new IntersectionObserver(es=>{for(const{target:v,isIntersecting:on}of es){
 if(on){if(!v.getAttribute('src'))v.src=v.dataset.src;v.play().catch(()=>{})}
 else if(v.getAttribute('src')){v.pause();v.removeAttribute('src');v.load()}}},{rootMargin:'200px 0px'});
for(const[t,u,m,b]of DEMOS){
 const agent=(u.match(/\.([a-z]+-[\d.]+-[a-z]+)\.html$/)||[])[1]||'',size=m.split(' ')[0],thumb=u.split('/dist/')[0]+'/thumb';
 const a=document.createElement('a');a.className='card';a.href=u;Object.assign(a.dataset,{size,agent});
 a.innerHTML=`<video data-src="${thumb}.${ext}" poster="${thumb}.png" muted loop playsinline disablepictureinpicture preload=none width=640 height=360></video>
  <h2>${esc(t)}</h2><div class=meta>${esc(m)} · ${AGENT[agent]||agent}</div><p class=brief>${esc(b)}</p>`;
 const v=a.querySelector('video');v.muted=true;if(!still)near.observe(v);
 g.append(a)}

// Filters: size budget and the agent that built it, kept in the URL (?size=16k&agent=haiku-5.5-medium) so a view can be shared.
const q=new URLSearchParams(location.search),F={size:q.get('size')||'',agent:q.get('agent')||''};
function apply(){let n=0;for(const c of g.children){c.hidden=!((!F.size||c.dataset.size===F.size)&&(!F.agent||c.dataset.agent===F.agent));n+=!c.hidden}
 document.getElementById('count').textContent=`Showing ${n} of ${g.children.length}`;
 for(const s of document.querySelectorAll('.seg'))for(const b of s.children)b.setAttribute('aria-pressed',b.dataset.v===F[s.dataset.f]);
 const p=new URLSearchParams();for(const k in F)if(F[k])p.set(k,F[k]);const qs=p.toString();history.replaceState(null,'',qs?'?'+qs:location.pathname)}
for(const s of document.querySelectorAll('.seg'))for(const b of s.children)b.onclick=()=>{F[s.dataset.f]=b.dataset.v;apply()};
apply();
</script></body></html>
