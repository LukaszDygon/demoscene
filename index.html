<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Demo Screening Room</title>
<link rel=icon type="image/svg+xml" href="favicon.svg">
<style>
:root{--bg:#0c0a12;--card:#161320;--fg:#eee;--mut:#9a93ad;--acc:#ff71ce;--link:#7ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,system-ui,sans-serif;padding:24px 16px}
main{max-width:1500px;margin:0 auto}
h1{font-size:20px;margin:0}p.s{color:var(--mut);margin:4px 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
.card{background:var(--card);border-radius:8px;padding:12px}
.card h2{font-size:16px;margin:0;color:var(--acc)}
.meta{color:var(--mut);font-size:12px;margin:2px 0 8px}.meta a{color:var(--link)}
.brief{font-size:13px;color:var(--mut);margin:8px 0 0}
.stage{aspect-ratio:16/9;background:#000;border-radius:4px;overflow:hidden;position:relative}
iframe{width:100%;height:100%;border:0}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>Demo Screening Room</h1>
<p class=s>Size-coded browser intros. Click a demo's screen to start it with sound; starting one resets the others. Open one in its own window for fullscreen.</p>
<div class=grid id=g></div>
</main><script>
// Add a demo: one line here. Paths are relative to this page.
const DEMOS=[
 ['ＶＡＰＯＲ ＭＡＬＬ','demos/vapor-mall/dist/vapor-mall.opus-5.5-high.html','64k · 45 KB','FPV flight through a vaporwave mall into the pocket of a smiling giant.'],
 ['Descensus','demos/descensus/dist/descensus.opus-5.5-high.html','64k · 30 KB','A slow descent into the deep sea: jellyfish, a whale, a sunken cathedral lit by an anglerfish.'],
 ['KAIJU','demos/kaiju-16k/dist/kaiju16k.opus-5.5-high.html','16k · 16 KB','Neon wireframe city at night, a tunnel run and a holographic KAIJU logo.'],
 ['Autumn Walk','demos/autumn-walk/dist/autumn-walk.opus-5.5-high.html','64k · 48 KB','A fox trots through an autumn forest to a cabin and a birthday cake for Mika.'],
 ['The Daily Flux','demos/daily-flux-16k/dist/the-daily-flux-16k.haiku-5.5-medium.html','16k · 13 KB · Haiku','Black-and-white 70s newspaper with headlines slamming in over muzak.'],
 ['ONE SECOND','demos/one-second-16k/dist/one-second-16k.haiku-5.5-medium.html','16k · 12 KB · Haiku','A marble bank lobby frozen mid-shootout. One second of time stretched across the piece, until it snaps.'],
 ['ONE SECOND','demos/one-second-64k/dist/one-second-64k.haiku-5.5-medium.html','64k · 30 KB · Haiku','A marble bank lobby frozen mid-shootout. One second of time stretched across the piece, until it snaps.'],
 ['INK & STEEL','demos/ink-and-steel-16k/dist/ink-and-steel-16k.haiku-5.5-medium.html','16k · 13 KB · Haiku','A rainy rooftop sword duel painted in sumi-e ink, with every clash splashing across the paper.'],
 ['INK & STEEL','demos/ink-and-steel-64k/dist/ink-and-steel-64k.haiku-5.5-medium.html','64k · 38 KB · Haiku','A rainy rooftop sword duel painted in sumi-e ink, with every clash splashing across the paper.'],
 ['RUST CONVOY','demos/rust-convoy-16k/dist/rust-convoy-16k.haiku-5.5-medium.html','16k · 12 KB · Haiku','War-rigs chase a fuel tanker across a salt flat at golden hour, ending in a canyon jump and fireball.'],
 ['RUST CONVOY','demos/rust-convoy-64k/dist/rust-convoy-64k.haiku-5.5-medium.html','64k · 28 KB · Haiku','War-rigs chase a fuel tanker across a salt flat at golden hour, ending in a canyon jump and fireball.'],
 ['TOY BOX WAR','demos/toy-box-war-16k/dist/toy-box-war-16k.haiku-5.5-medium.html','16k · 15 KB · Haiku','Plastic army men against stuffed animals on a bedroom floor, played straight as a war epic.'],
 ['TOY BOX WAR','demos/toy-box-war-64k/dist/toy-box-war-64k.haiku-5.5-medium.html','64k · 35 KB · Haiku','Plastic army men against stuffed animals on a bedroom floor, played straight as a war epic.'],
 ['SILENT FLEET','demos/silent-fleet-16k/dist/silent-fleet-16k.haiku-5.5-medium.html','16k · 13 KB · Haiku','Capital ships break apart silently above a gas giant, seen from one drifting escape pod.'],
 ['SILENT FLEET','demos/silent-fleet-64k/dist/silent-fleet-64k.haiku-5.5-medium.html','64k · 29 KB · Haiku','Capital ships break apart silently above a gas giant, seen from one drifting escape pod.'],
 ['KA-BOOM!','demos/ka-boom-16k/dist/ka-boom-16k.haiku-5.5-medium.html','16k · 14 KB · Haiku',"Pure kinetic typography: Swiss-poster words colliding to a 174 BPM drum'n'bass break."],
 ['KA-BOOM!','demos/ka-boom-64k/dist/ka-boom-64k.haiku-5.5-medium.html','64k · 26 KB · Haiku',"Pure kinetic typography: Swiss-poster words colliding to a 174 BPM drum'n'bass break."],
 ['DOMINO HOUSE','demos/domino-house-16k/dist/domino-house-16k.haiku-5.5-medium.html','16k · 9 KB · Haiku','One unbroken shot of a chain reaction through a pastel dollhouse, to a waltz that falls apart.'],
 ['DOMINO HOUSE','demos/domino-house-64k/dist/domino-house-64k.haiku-5.5-medium.html','64k · 35 KB · Haiku','One unbroken shot of a chain reaction through a pastel dollhouse, to a waltz that falls apart.'],
 ['THE TAPESTRY','demos/the-tapestry-16k/dist/the-tapestry-16k.haiku-5.5-medium.html','16k · 12 KB · Haiku','A medieval siege embroidered on a tapestry that comes alive, dragon fire burning through the cloth.'],
 ['THE TAPESTRY','demos/the-tapestry-64k/dist/the-tapestry-64k.haiku-5.5-medium.html','64k · 32 KB · Haiku','A medieval siege embroidered on a tapestry that comes alive, dragon fire burning through the cloth.'],
 ['TWISTER TAPE','demos/twister-tape-16k/dist/twister-tape-16k.haiku-5.5-medium.html','16k · 12 KB · Haiku','Recovered VHS footage of a tornado tearing through a plains town.'],
 ['TWISTER TAPE','demos/twister-tape-64k/dist/twister-tape-64k.haiku-5.5-medium.html','64k · 34 KB · Haiku','Recovered VHS footage of a tornado tearing through a plains town.'],
 ['INSERT COIN','demos/insert-coin-16k/dist/insert-coin-16k.haiku-5.5-medium.html','16k · 13 KB · Haiku','An attract-mode run of an original pixel brawler, with chunky CRT pixels and chiptune.'],
 ['INSERT COIN','demos/insert-coin-64k/dist/insert-coin-64k.haiku-5.5-medium.html','64k · 58 KB · Haiku','An attract-mode run of an original pixel brawler, with chunky CRT pixels and chiptune.']];
const g=document.getElementById('g');
// Browsers cap live WebGL contexts (~16 per page), so only demos near the viewport stay loaded.
// A card that scrolls well away is unloaded, unless that demo is playing.
const vis=new IntersectionObserver(es=>{for(const{target:f,isIntersecting:on}of es){
 const live=f.getAttribute('src')===f.dataset.src;
 if(on&&!live)f.src=f.dataset.src;else if(!on&&live&&!f.dataset.on)f.src='about:blank'}},{rootMargin:'300px 0px'});
for(const[t,u,m,b]of DEMOS){const c=document.createElement('section');c.className='card';
 c.innerHTML=`<h2>${t}</h2><div class=meta>${m} · <a href="${u}" target=_blank>open in own window ↗</a></div>
 <div class=stage><iframe allow="autoplay; fullscreen" allowfullscreen data-src="${u}"></iframe></div><p class=brief>${b}</p>`;
 const f=c.querySelector('iframe');vis.observe(f);
 // one demo at a time: a click inside one reloads any other that has been started (back to its start screen)
 f.onload=()=>{try{f.contentWindow.addEventListener('pointerdown',()=>{
  for(const o of document.querySelectorAll('iframe'))if(o!==f&&o.dataset.on){delete o.dataset.on;o.src=o.src}
  f.dataset.on=1},true)}catch{}};
 g.append(c)}
</script></body></html>
