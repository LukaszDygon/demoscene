<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>DOMINO HOUSE</title><style>
*{margin:0}body{background:#fdf6ec;overflow:hidden;font-family:"Avenir Next","Trebuchet MS",Verdana,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
#t{position:fixed;left:0;right:0;bottom:8%;text-align:center;color:#fff;text-shadow:0 2px 10px #0008,0 0 3px #0006;pointer-events:none}
#t b{display:block;font-size:6vh;letter-spacing:.12em}#t i{font-size:2.2vh;font-style:normal;letter-spacing:.3em}
#s{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;background:#fff5;cursor:pointer;transition:opacity .6s}
#s.x{opacity:0;pointer-events:none}
#d{width:7vh;height:22vh;background:#fffbe9;border:.4vh solid #c9a;border-radius:.6vh;box-shadow:0 1vh 2vh #0003;transform-origin:50% 100%;transition:transform .4s ease-in}
#s.x #d{transform:rotate(-70deg)}
#s b{font-size:4vh;letter-spacing:.3em;color:#e0707a;animation:f 1.6s ease-in-out infinite}
@keyframes f{50%{opacity:.35}}
</style>
<canvas id=c></canvas><div id=t></div>
<div id=s><div id=d></div><b>TAP TO TIP</b></div>

<script>/*MUSIC*/</script>
