<script>// ONE SECOND - soundtrack. 60 BPM (one beat = one second), 25 bars, about 100 s.
// The same scheduler runs live and offline (SONG.render), so check.mjs audio can measure it.
var SONG=(()=>{
const BPM=60,BAR=240/BPM,BEAT=60/BPM,BARS=25,LEN=BARS*BAR+2;
const HIT=97,END=99.2;                        // the massive hit lands with the snap; silence from END
const VOICES=[73.42,87.31,110],PARTS=6;       // D2 F2 A2, six octave partials each
// ticks: the interval grows from 0.5 s to about 4 s, so the clock slows down
const TICKS=[];for(let t=.5;t<HIT-1;t+=.5*Math.exp(t/32))TICKS.push(t);
const hv=s=>s<32?.4:s<72?.7:.95;              // heartbeat level by time
function setup(A,base){
 const SR=A.sampleRate;
 let bag=[];const BAGS=[],keep=n=>(bag.push(n),n);
 const G=(v,...to)=>{const g=keep(A.createGain());g.gain.value=v;to.forEach(n=>g.connect(n));return g};
 const sweep=(t,dur,f0,f1,v,to)=>{const o=keep(A.createOscillator()),g=keep(A.createGain());
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);
  o.connect(g);g.connect(to);o.start(t);o.stop(t+dur)};
 const NB=A.createBuffer(1,SR*2|0,SR),nd=NB.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
 const noise=(t,dur,type,f,q,v,to)=>{const s=keep(A.createBufferSource()),fl=keep(A.createBiquadFilter()),g=keep(A.createGain());
  s.buffer=NB;fl.type=type;fl.frequency.value=f;fl.Q.value=q;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);
  s.connect(fl);fl.connect(g);g.connect(to);s.start(t,Math.random());s.stop(t+dur)};
 // master chain: compressor, a generated reverb IR, and a hard silence after END
 const comp=A.createDynamicsCompressor();comp.connect(A.destination);
 const master=G(.7,comp);
 master.gain.setValueAtTime(.7,base+END);master.gain.linearRampToValueAtTime(0,base+END+.15);
 const IR=A.createBuffer(2,SR*2.5|0,SR);
 for(let c=0;c<2;c++){const d=IR.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)**3}
 const cv=A.createConvolver();cv.buffer=IR;
 const bus=G(1,master,cv);cv.connect(G(.5,master));
 // Shepard strings, built once outside the bags. Each partial glides up one octave over the piece and its
 // level is a bell in log-frequency, so partials fade out at the top as they come in at the bottom.
 const lp=A.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1600;lp.connect(master);
 const str=A.createGain();str.gain.setValueAtTime(0,base);str.gain.linearRampToValueAtTime(.22,base+8);str.connect(lp);
 const N=HIT*10+1;
 for(const v of VOICES)for(let k=0;k<PARTS;k++){
  const f0=v*2**k,o=A.createOscillator(),g=A.createGain(),C=new Float32Array(N);
  for(let i=0;i<N;i++){const x=(Math.log2(f0)+i/10/HIT-8)/1.6;C[i]=.07*Math.exp(-x*x/2)}
  o.type='sawtooth';o.frequency.setValueAtTime(f0,base);o.frequency.exponentialRampToValueAtTime(2*f0,base+HIT);
  g.gain.setValueCurveAtTime(C,base,HIT);
  o.connect(g);g.connect(str);o.start(base);o.stop(base+LEN);
 }
 const heart=(t,v)=>{sweep(t,.25,58,34,.9*v,bus);sweep(t+.3,.2,58,34,.55*v,bus)};
 const tick=t=>noise(t,.03,'bandpass',3200,4,.12,bus);
 function hit(t){
  sweep(t,2.4,120,28,1,bus);
  noise(t,2.6,'lowpass',500,.7,.9,bus);
  noise(t,1.6,'highpass',2500,.5,.35,bus);
  for(const d of[0,.04,.1])noise(t+d,.35,'bandpass',1800,1.5,.5,bus);   // three shots
 }
 function bar(b,t){
  const s=b*BAR,at=x=>t+x-s;
  for(const x of TICKS)if(x>=s&&x<s+BAR)tick(at(x));
  for(let k=0;k<4;k++){const x=s+k*BEAT;if(x>=8&&x<96)heart(at(x),hv(x))}
  if(HIT>=s&&HIT<s+BAR)hit(at(HIT));
 }
 function sched(b){bag=[];
  if(b>2&&BAGS[b-3]){BAGS[b-3].forEach(n=>n.disconnect());BAGS[b-3]=0}
  BAGS[b]=bag;bar(b,base+b*BAR)}
 bag=[];sched.out=comp;return sched}
// live: schedule each bar ~1.2 s before it plays
function live(A,from=0){const base=A.currentTime+.15-from,sched=setup(A,base);let b=Math.ceil(from/BAR-.001);
 const tick=()=>{while(b<BARS&&base+b*BAR<A.currentTime+1.2)sched(b++)};tick();const iv=setInterval(tick,100);
 return{base,stop(){clearInterval(iv);sched.out.disconnect()}}}
// offline: the same code, with bars injected via suspend() so the graph stays small
function render(){const SR=44100,A=new OfflineAudioContext(2,SR*LEN|0,SR),sched=setup(A,0);sched(0);
 for(let b=1;b<BARS;b++)A.suspend(((b*BAR-.5)*SR/128|0)*128/SR).then(()=>{sched(b);A.resume()});
 return A.startRendering()}
return{live,render,BPM,BAR,BARS,LEN,HIT,END}})();
</script>
<script>// ONE SECOND: visuals, camera and timeline. T = seconds since the click; S = frozen seconds (1/100 speed until the snap).
const HIT=97,CUT=98.5,END=100;
const $=i=>document.getElementById(i);
const cv=$('c'),gl=cv.getContext('webgl2',{antialias:false,alpha:false});
const SCENE=`#version 300 es
precision highp float;
uniform vec2 uRes;uniform vec3 uEye,uTgt;uniform float uFocus,uS,uFall,uFire,uBeat;
uniform vec4 uSh[18],uShA[18],uShV[18],uBn[10],uBnA[10],uCa[12],uBd[6];
out vec4 oc;
const vec3 KL=vec3(.119,.9917,.0496);
const vec3 MG=vec3(4.1,.6,-3.45),MR=vec3(-.95,1.85,-1.55);
float h1(float n){return fract(sin(n)*43758.5453);}
float n3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);float n=dot(i,vec3(1.,57.,113.));
return mix(mix(mix(h1(n),h1(n+1.),f.x),mix(h1(n+57.),h1(n+58.),f.x),f.y),
mix(mix(h1(n+113.),h1(n+114.),f.x),mix(h1(n+170.),h1(n+171.),f.x),f.y),f.z);}
float cap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}
float box(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}
float sg(vec2 p,vec2 b){return length(p-b*clamp(dot(p,b)/dot(b,b),0.,1.));}
vec3 rod(vec3 p,vec3 k,float a){return p*cos(a)+cross(k,p)*sin(a)+k*dot(k,p)*(1.-cos(a));}
vec2 U(vec2 a,vec2 b){return a.x<b.x?a:b;}
vec2 M(vec3 p){
vec2 r=vec2(p.y,0.);
r=U(r,vec2(max(min(10.-abs(p.x),min(8.-p.z,p.z+10.)),p.y-9.),1.));
r=U(r,vec2(max(abs(p.y-9.2)-.2,-max(abs(p.x-.6)-2.5,abs(p.z)-2.5)),1.));
vec3 q=p;q.z-=6.*floor(p.z/6.+.5);
r=U(r,vec2(max(length(vec2(abs(p.x)-7.,q.z))-.6,abs(p.y-4.5)-4.5),1.));
r=U(r,vec2(box(p-vec3(4.,.5,2.),vec3(1.5,.5,.4)),2.));
r=U(r,vec2(box(p-vec3(0.,2.2,-9.9),vec3(2.2,2.2,.05)),2.));
vec3 h=p-vec3(-2.2,2.2,-9.6);
vec3 dq=vec3(h.x*.9004+h.z*.435,h.y,-h.x*.435+h.z*.9004)-vec3(2.2,0.,0.);
r=U(r,vec2(box(dq,vec3(2.2,2.2,.1)),4.));
r=U(r,vec2(length(p-vec3(0.,8.4,-9.2))-.28,5.));
vec3 k=p-vec3(-9.9,5.4,-2.);
r=U(r,vec2(max(length(k.yz)-1.2,abs(k.x)-.1),7.));
float hd=min(sg(k.zy,vec2(.78,.45)),min(sg(k.zy,vec2(-.52,.3)),sg(k.zy,vec2(0.,1.05))));
r=U(r,vec2(max(hd-.035,abs(k.x)-.14),2.));
float gb=length(p-vec3(1.6,1.5,-2.))-3.3;
if(gb<r.x){
vec3 gp=p-vec3(0.,min(uFall,.8),0.);
float g=length(gp-vec3(3.,.95,-2.9))-.2;
g=min(g,cap(gp,vec3(2.5,1.1,-2.6),vec3(1.6,1.5,-2.1),.28));
g=min(g,cap(gp,vec3(1.6,1.5,-2.1),vec3(.5,2.1,-1.3),.2));
g=min(g,cap(gp,vec3(.5,2.1,-1.3),vec3(-.3,2.5,-.8),.17));
g=min(g,cap(gp,vec3(2.6,1.2,-2.7),vec3(3.6,.7,-3.2),.1));
g=min(g,cap(gp,vec3(2.4,1.1,-2.5),vec3(3.3,.4,-3.),.1));
g=min(g,cap(gp,vec3(3.6,.7,-3.2),vec3(4.,.6,-3.4),.07));
r=U(r,vec2(g,2.));
}
float rb=length(p-vec3(-2.6,1.6,-1.2))-2.6;
if(rb<r.x){
float g=length(p-vec3(-2.5,2.75,-1.))-.2;
g=min(g,cap(p,vec3(-2.5,2.4,-1.),vec3(-2.5,1.4,-1.),.3));
g=min(g,cap(p,vec3(-2.4,1.2,-1.),vec3(-2.,.55,-.4),.17));
g=min(g,cap(p,vec3(-2.,.55,-.4),vec3(-1.7,.12,.2),.14));
g=min(g,cap(p,vec3(-2.6,1.2,-1.),vec3(-3.2,.6,-1.5),.17));
g=min(g,cap(p,vec3(-3.2,.6,-1.5),vec3(-3.8,.12,-2.1),.14));
g=min(g,cap(p,vec3(-2.5,2.1,-1.),vec3(-1.5,1.9,-1.3),.1));
g=min(g,cap(p,vec3(-1.5,1.9,-1.3),vec3(-.95,1.85,-1.55),.06));
r=U(r,vec2(g,2.));
}
for(int i=0;i<6;i++){vec4 b=uBd[i];r=U(r,vec2(length(p-b.xyz+vec3(0.,min(uFall,1.),0.))-b.w,8.));}
float sb=length(p-vec3(.6,6.3,0.))-5.;
if(sb<r.x||uFall>0.){
for(int i=0;i<18;i++){vec4 s=uSh[i],a=uShA[i];
vec3 c=s.xyz+uShV[i].xyz*uS;c.y=max(c.y-uFall,.05);
vec3 q=rod(p-c,a.xyz,s.w*6.283+uS*a.w);
r=U(r,vec2(box(q,vec3(.08,.004,.1)),3.));}
}
float nb=length(p-vec3(0.,3.8,-1.))-6.6;
if(nb<r.x||uFall>0.){
for(int i=0;i<10;i++){vec4 b=uBn[i],a=uBnA[i];
vec3 c=vec3(b.x,max(b.y-uFall,.05),b.z);
vec3 q=rod(p-c,a.xyz,b.w*6.283+uS*a.w);
r=U(r,vec2(box(q,vec3(.17,.004,.09)),6.));}
}
if(p.y<2.){
for(int i=0;i<12;i++){vec4 b=uCa[i];
vec3 q=p-b.xyz;float c=cos(b.w*6.283),s=sin(b.w*6.283);q.xz=mat2(c,-s,s,c)*q.xz;
r=U(r,vec2(box(q,vec3(.12,.035,.035)),4.));}
}
return r;
}
vec3 fl(vec3 p,vec3 F,float k){vec3 v=p-F;float d2=dot(v,v);
return k*(vec3(1.,.97,.92)*(.012/(.01+d2)+.03/(.25+d2))+vec3(1.,.02,.01)*.02/(.0008+d2)+vec3(.45)*exp(-d2*2.5)*n3(p*3.)*.3);}
vec3 vol(vec3 p){
vec3 c=vec3(0.);
if(p.y<9.){float s=(9.-p.y)/KL.y;vec2 hp=vec2(p.x+s*KL.x,p.z+s*KL.z)-vec2(.6,0.);
float e=max(abs(hp.x)-2.5,abs(hp.y)-2.5);
float sh=(1.-smoothstep(-.6,.6,e))*(.3+.7*n3(p*vec3(1.,.5,1.)*1.5));
c+=vec3(1.,.98,.95)*sh*.022+vec3(1.)*sh*smoothstep(.72,.8,n3(p*8.))*.5;}
c+=fl(p,MG,uFire)+fl(p,MR,uFire);
return c;
}
vec3 nrm(vec3 p){const vec2 e=vec2(.001,-.001);
return normalize(e.xyy*M(p+e.xyy).x+e.yyx*M(p+e.yyx).x+e.yxy*M(p+e.yxy).x+e.xxx*M(p+e.xxx).x);}
float shd(vec3 p){float res=1.,t=.06;
for(int i=0;i<36;i++){float d=M(p+KL*t).x;res=min(res,10.*d/t);t+=clamp(d,.03,.6);if(t>16.)break;}
return clamp(res,0.,1.);}
float ao(vec3 p,vec3 n){float o=0.,s=1.;
for(int i=1;i<5;i++){float h=.09*float(i);o+=(h-M(p+n*h).x)*s;s*=.75;}
return clamp(1.-1.6*o,0.,1.);}
vec3 shade(vec3 p,vec3 n,float m,vec3 rd){
if(m>4.5&&m<5.5)return vec3(1.,.03,.02)*(2.2+.6*uBeat);
vec3 al=vec3(.85);float sp=0.;
if(m<.5){float tl=mod(floor(p.x*.5)+floor(p.z*.5),2.);
al=vec3(.8+.07*tl)*mix(.5,1.,smoothstep(0.,.12,abs(sin(3.*(p.x+p.z)+5.*n3(p*.6)))));sp=.2;}
else if(m<1.5){al=vec3(.9)*mix(.6,1.,smoothstep(0.,.15,abs(sin(2.*p.y+3.*p.x+4.*n3(p*.5)))));}
else if(m<2.5){al=vec3(.05);sp=.3;}
else if(m<3.5){al=vec3(1.);sp=1.;}
else if(m<4.5){al=vec3(.55);sp=.9;}
else if(m<6.5){al=vec3(.92);sp=.1;}
else if(m<7.5){al=vec3(.95);}
else{al=vec3(.5,.01,.01);sp=.6;}
float dif=max(dot(n,KL),0.)*shd(p+n*.01);
vec3 col=al*(vec3(.07,.07,.075)*ao(p,n)+vec3(1.,.97,.93)*dif*1.1);
vec3 v=MG-p;float d2=dot(v,v);
col+=al*uFire*vec3(1.,.95,.9)*max(dot(n,normalize(v)),0.)*1.2/(1.+d2);
v=MR-p;d2=dot(v,v);
col+=al*uFire*vec3(1.,.95,.9)*max(dot(n,normalize(v)),0.)*1.2/(1.+d2);
v=vec3(0.,8.4,-9.2)-p;d2=dot(v,v);
col+=al*vec3(1.,.04,.02)*max(dot(n,normalize(v)),0.)*(3.2+1.*uBeat)/(1.+.05*d2);
col+=vec3(1.)*sp*pow(max(dot(n,normalize(KL-rd)),0.),40.)*dif*.8;

}
void main(){
vec2 uv=(2.*gl_FragCoord.xy-uRes)/uRes.y;
vec3 ww=normalize(uTgt-uEye),uu=normalize(cross(ww,vec3(0.,1.,0.))),vv=cross(uu,ww);
vec3 ro=uEye,rd=normalize(uv.x*uu+uv.y*vv+1.6*ww);
vec3 acc=vec3(0.);float t=0.,ht=-1.,mt=0.;
for(int i=0;i<120;i++){
vec3 p=ro+rd*t;vec2 h=M(p);float d=h.x,st=min(d,.6);
acc+=vol(p)*max(st,.01);
if(d<.0008*t){ht=t;mt=h.y;break;}
t+=st;
if(t>40.)break;
}
vec3 col;float dep=1.;
if(ht>0.){vec3 p=ro+rd*ht;col=shade(p,nrm(p),mt,rd);dep=min(ht/40.,1.);}
else col=vec3(1.6,1.6,1.55);
oc=vec4(col+acc,dep);
}`,POST=`#version 300 es
precision highp float;
uniform sampler2D uT;uniform vec2 uRes;uniform float uFN,uWhite,uOn;
out vec4 oc;
float hs(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){
vec2 uv=gl_FragCoord.xy/uRes;
vec4 c=texture(uT,uv);
float R=clamp(abs(c.a-uFN)*14.,0.,1.)*uRes.y*.011;
vec3 acc=c.rgb;float ws=1.;
for(int i=0;i<20;i++){float fi=float(i),a=fi*2.39996,r=sqrt((fi+.5)/20.)*R;
acc+=texture(uT,uv+vec2(cos(a),sin(a))*r/uRes).rgb;ws+=1.;}

col*=.8;
col=(col*(2.51*col+.03))/(col*(2.43*col+.59)+.14);
col=pow(col,vec3(1./2.2));

const VS='#version 300 es\nin vec2 q;void main(){gl_Position=vec4(q,0.,1.);}';
function prog(fs){const p=gl.createProgram();
 for(const[t,s]of[[gl.VERTEX_SHADER,VS],[gl.FRAGMENT_SHADER,fs]]){const h=gl.createShader(t);gl.shaderSource(h,s);gl.compileShader(h);
  if(!gl.getShaderParameter(h,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(h));gl.attachShader(p,h)}
 gl.bindAttribLocation(p,0,'q');gl.linkProgram(p);return p}
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);

const ul=(p,names)=>Object.fromEntries(names.map(n=>[n,gl.getUniformLocation(p,n)]));
const SU=ul(PS,['uRes','uEye','uTgt','uFocus','uS','uFall','uFire','uBeat','uSh','uShA','uShV','uBn','uBnA','uCa','uBd']);
const PU=ul(PP,['uT','uRes','uFN','uWhite','uOn']);

// fixed scatter of the frozen debris (seeded, so every run is the same frame)
let sd=12345;const rnd=()=>(sd=sd*16807%2147483647)/2147483647;
const nrm=()=>{const x=rnd()-.5,y=rnd()-.5,z=rnd()-.5,l=Math.hypot(x,y,z);return[x/l,y/l,z/l]};
const SH=new Float32Array(72),SHA=new Float32Array(72),SHV=new Float32Array(72);
for(let i=0;i<18;i++){SH.set([.6+(rnd()*2-1)*3.2,4.4+rnd()*4.2,(rnd()*2-1)*2.6,rnd()],i*4);
 SHA.set([...nrm(),.3+rnd()*1.1],i*4);SHV.set([(rnd()-.5)*.25,0,(rnd()-.5)*.25,0],i*4)}
const BN=new Float32Array(40),BNA=new Float32Array(40);
for(let i=0;i<10;i++){BN.set([rnd()*8-4,1.6+rnd()*4.4,rnd()*8-5,rnd()],i*4);BNA.set([...nrm(),.3+rnd()*.5],i*4)}
const CA=new Float32Array(48);for(let i=0;i<12;i++)CA.set([rnd()*9-4.5,.04,rnd()*7-5,rnd()],i*4);
const BD=new Float32Array(24);for(let i=0;i<6;i++)BD.set([2.7+rnd()*.7,1+rnd()*.7,-2.6+rnd()*.5,.035+rnd()*.05],i*4);

// camera keyframes [t, eye, target, focus distance]; equal times are cuts
const KF=[
 [0,.5,1.6,6.5, .6,6.2,0, 7.5],[16,.5,2.6,3.5, .6,6,0, 6.2],                       // A skylight: dolly up through the shafts
 [16,6.5,1.8,4, 3.2,1,-2.6, 6],[32,0,2.4,4, 3,1.1,-2.5, 6],                       // B muzzle flashes: orbit the guard
 [32,-4.5,.7,6, -2.4,1.2,-1, 5],[44,-5.5,.8,4.5, -2.5,1.1,-1.2, 4.5],             // C robber mid-stride, low
 [44,.2,.8,3.5, 0,0,-1, 3.5],[56,-1.5,1.2,2.6, -.5,0,-1.8, 3],                        // D brass casings on the marble
 [56,0,3.6,7, 0,2.5,-9, 16],[72,-.4,3.8,-3.5, -.9,2.5,-9.4, 6.5],                      // E vault ajar under the alarm
 [72,-4.5,4.2,1, -9.8,5.4,-2, 5.5],[84,-5,4.6,-1, -9.8,5.4,-2, 4.6],              // F wall clock, frozen second hand
 [84,4.5,4,6.5, 0,3.5,-1, 11],[96,-5.5,5,4.5, 0,3,-1.5, 11],[100,-5.5,5,4.5, 0,3,-1.5, 11] // G wide orbit, H the snap
];
function cam(t){t=Math.max(0,t);let i=0;while(i<KF.length-1&&KF[i+1][0]<=t)i++;
 const a=KF[i],b=KF[i+1];
 if(!b)return{e:a.slice(1,4),t:a.slice(4,7),f:a[7]};
 const u0=(t-a[0])/(b[0]-a[0]),u=u0*u0*(3-2*u0),m=k=>a[k]+(b[k]-a[k])*u;
 return{e:[m(1),m(2),m(3)],t:[m(4),m(5),m(6)],f:m(7)}}
// heartbeat pulse, lub-dub once a second from bar 2 to the snap
const beat=T=>T<8||T>=96?0:Math.exp(-7*(T%1))+.6*Math.exp(-7*((T+.7)%1));

// render target: half float when the GPU allows it, else 8-bit (alpha still carries depth)
const hasF=!!gl.getExtension('EXT_color_buffer_float');
const FMT=hasF?gl.RGBA16F:gl.RGBA8,TYPE=hasF?gl.HALF_FLOAT:gl.UNSIGNED_BYTE;
const tex=gl.createTexture(),fb=gl.createFramebuffer();
gl.bindTexture(gl.TEXTURE_2D,tex);
for(const[k,v]of[[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,k,v);
gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
let W=2,H=2,q=1;
function size(){const d=Math.min(devicePixelRatio||1,2),w=innerWidth*d,h=innerHeight*d,s=Math.min(1,Math.sqrt(7e5/(w*h)))*q;
 W=Math.max(2,Math.round(w*s));H=Math.max(2,Math.round(h*s));cv.width=W;cv.height=H;
 gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,FMT,W,H,0,gl.RGBA,TYPE,null)}

function draw(T){
 const S=T<HIT?T*.01:HIT*.01+(T-HIT),F=Math.max(T-HIT,0),c=cam(T);
 gl.bindFramebuffer(gl.FRAMEBUFFER,fb);gl.viewport(0,0,W,H);gl.useProgram(PS);
 gl.uniform2f(SU.uRes,W,H);gl.uniform3fv(SU.uEye,c.e);gl.uniform3fv(SU.uTgt,c.t);gl.uniform1f(SU.uFocus,c.f);
 gl.uniform1f(SU.uS,S);gl.uniform1f(SU.uFall,4.9*F*F);gl.uniform1f(SU.uFire,F>0?.9+2.4*Math.exp(-5*F):.9);
 gl.uniform1f(SU.uBeat,beat(T));
 gl.uniform4fv(SU.uSh,SH);gl.uniform4fv(SU.uShA,SHA);gl.uniform4fv(SU.uShV,SHV);
 gl.uniform4fv(SU.uBn,BN);gl.uniform4fv(SU.uBnA,BNA);gl.uniform4fv(SU.uCa,CA);gl.uniform4fv(SU.uBd,BD);
 gl.drawArrays(gl.TRIANGLES,0,3);
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);gl.useProgram(PP);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
 gl.uniform1i(PU.uT,0);gl.uniform2f(PU.uRes,W,H);gl.uniform1f(PU.uFN,c.f/40);
 gl.uniform1f(PU.uWhite,F>0?1.6*Math.exp(-7*F):0);gl.uniform1f(PU.uOn,T<CUT?1:0);
 gl.drawArrays(gl.TRIANGLES,0,3);
}
const tc=$('tc');
function timecode(T){
 if(T>=CUT){tc.style.opacity=0;return}
 const ms=Math.min(1000,Math.round(T/HIT*1000));
 tc.textContent='00:0'+(ms>=1000?1:0)+'.'+String(ms%1000).padStart(3,'0');
}

// the start screen is the frozen frame; the first click starts the audio clock, which drives everything
let actx=null,song=null;
async function go(){if(actx)return;
 try{actx=new AudioContext();await actx.resume();song=SONG.live(actx,0)}catch(e){console.error(e)}
 document.body.classList.add('go')}
addEventListener('click',go);
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter')go()});
addEventListener('resize',size);

let ema=16,last=performance.now();
function loop(now){
 ema=ema*.9+(now-last)*.1;last=now;
 const T=song?Math.max(0,actx.currentTime-song.base):0;
 if(ema>34&&q>.5){q*=.85;size()}
 draw(T);timecode(T);
 if(T<END)requestAnimationFrame(loop);
}
size();requestAnimationFrame(loop);

// clearance probe: the camera path against rough boxes for the set (walls, columns, counter, figures, door, clock)
window.__probe={dur:END,cam:t=>cam(t).e,boxes:[
 [2.5,0,1.6,5.5,1,2.4],
 [6.4,0,-6.6,7.6,9,-5.4],[6.4,0,-.6,7.6,9,.6],[6.4,0,5.4,7.6,9,6.6],
 [-7.6,0,-6.6,-6.4,9,-5.4],[-7.6,0,-.6,-6.4,9,.6],[-7.6,0,5.4,-6.4,9,6.6],
 [2,.2,-3.4,4.4,2.2,-1.4],[-4,0,-2.5,-1.2,2.8,-.4],[-2.3,0,-9.8,2.3,4.5,-9.4],[-10.1,4.2,-3.2,-9.7,6.6,-.8],
 [-10.5,0,-10.5,-10,9,8.5],[10,0,-10.5,10.5,9,8.5],[-10.5,0,-10.5,10.5,9,-10],[-10.5,0,8,10.5,9,8.5]]};
