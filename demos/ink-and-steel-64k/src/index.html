<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>墨と鋼 · INK &amp; STEEL</title>
<style>
html,body{margin:0;height:100%;background:#efe8d3;overflow:hidden;cursor:pointer}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.seal{position:fixed;left:50%;top:50%;z-index:2;width:min(34vmin,260px);aspect-ratio:1;transform:translate(-50%,-50%) rotate(-2deg);
 display:flex;flex-direction:column;align-items:center;justify-content:center;background:#b3261e;color:#f6eedb;
 border-radius:4px 7px 5px 8px/7px 4px 8px 5px;pointer-events:none}
.seal:before{content:"";position:absolute;inset:5%;border:2px solid rgba(246,238,219,.7);border-radius:inherit}
#seal{transition:opacity 1.4s ease,transform 1.4s ease}
#seal.gone{opacity:0;transform:translate(-50%,-50%) rotate(-2deg) scale(1.05)}
#seal b{font:700 min(8vmin,46px)/1.15 "Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Songti SC","Noto Serif SC",SimSun,serif;letter-spacing:.2em;margin-right:-.2em}
#seal i{font:600 min(2.6vmin,15px)/1 Georgia,"Times New Roman",serif;font-style:normal;letter-spacing:.24em;margin-top:.9em}
#stamp{position:fixed;left:50%;top:40%;z-index:4;width:min(22vmin,150px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;
 background:#b3261e;color:#f6eedb;font:700 min(9vmin,58px)/1 "Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Songti SC",SimSun,serif;
 border-radius:5px 8px 6px 9px/8px 5px 9px 6px;opacity:0;pointer-events:none;transform:translate(-50%,-50%)}
#stamp.go{animation:stp 2.4s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes stp{0%{opacity:0;transform:translate(-50%,-50%) scale(1.9) rotate(-9deg)}10%{opacity:.95;transform:translate(-50%,-50%) scale(.97) rotate(-3deg)}55%{opacity:.9;transform:translate(-50%,-50%) scale(1) rotate(-3deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.04) rotate(-3deg)}}
#cap{position:fixed;left:0;right:0;bottom:8vh;z-index:3;text-align:center;opacity:0;transition:opacity 1.1s;pointer-events:none;
 color:#141414;text-shadow:0 0 .6em rgba(239,232,211,.95),0 0 .2em rgba(239,232,211,.9)}
#cap.on{opacity:1}
#cj{display:block;font:400 clamp(30px,6.5vw,76px)/1.15 "Kaiti SC",STKaiti,KaiTi,BiauKai,"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Songti SC",SimSun,serif;letter-spacing:.18em}
#cj:after{content:"";display:block;height:.07em;margin:.22em auto 0;width:min(40vw,320px);background:#141414;opacity:.8;transform:scaleX(0);transform-origin:left;clip-path:polygon(0 30%,100% 0,100% 70%,0 100%)}
#cap.on #cj:after{animation:ul 1.2s .3s forwards}
.ch{display:inline-block;opacity:0}
#cap.on .ch{animation:ink .9s ease-out forwards}
#ce{display:block;margin-top:.6em;font:italic 400 clamp(11px,1.6vw,16px)/1.4 Georgia,"Times New Roman",serif;letter-spacing:.32em;text-transform:uppercase;opacity:0}
#cap.on #ce{animation:ink 1.8s .5s forwards}
@keyframes ink{0%{opacity:0;filter:blur(7px);transform:scale(1.12)}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes ul{to{transform:scaleX(1)}}
</style></head><body>
<canvas id="c"></canvas>
<div id="seal" class="seal"><b>墨と鋼</b><i>INK &amp; STEEL</i></div>
<div id="stamp"></div>
<div id="cap"><b id="cj"></b><i id="ce"></i></div>
<script>/*MUSIC*/</script>
<script>/*MAIN*/</script>
</body></html>
