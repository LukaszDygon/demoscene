<style>

<div class=o id=ti><h1>RUST CONVOY</h1><p>CLICK TO IGNITE</p></div>
<div class=o id=en><h2>THE SALT KEEPS THE FIRE</h2><p>RUST CONVOY &middot; MMXXVI</p></div>
<script type=x-shader id=fs>#version 300 es
precision highp float;
// One raymarched pass: salt flat, dunes, a canyon gap, four vehicles, dust, fire and the post chain.
uniform vec2 R;
uniform float T,ZC,DU,HL,SKI,EQ,EI,TA;
uniform vec3 CP,TP,P0,P1,P2,SD,HA,HB,SK,EXP;
uniform mat3 M;             // camera basis: columns right, up, forward
uniform vec4 DS[4],DA;      // dust sources: xyz centre, w radius; DA = amplitude
uniform vec3 EX[4];         // exhaust flame points
out vec4 O;
const float FF=.8;          // focal length in screen-height units
const vec3 HZ=vec3(.95,.6,.36);

float bx(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}
float cy(vec2 a,float r,float x,float h){vec2 d=vec2(length(a)-r,abs(x)-h);return min(max(d.x,d.y),0.)+length(max(d,0.));}
float cp(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;return length(pa-ba*clamp(dot(pa,ba)/dot(ba,ba),0.,1.))-r;}
vec2 U2(vec2 a,vec2 b){return a.x<b.x?a:b;}

// ground: flat salt on the road, dunes beyond 14 units, a canyon 14 units deep across the road at z=ZC
float gh(vec2 q){
 float d=smoothstep(14.,30.,abs(q.x))*(3.*sin(q.x*.13+q.y*.03)*sin(q.y*.07-q.x*.05)+4.+2.*sin(q.y*.21));
 return mix(-30.,d,smoothstep(7.,12.,abs(q.y-ZC)));
}
// tanker, local to its base; the trailer swings about a pivot at z=2 (jackknife, angle TA)
vec2 tk(vec3 q){
 vec3 t=q-vec3(0.,0.,2.);
 t.xz=mat2(cos(TA),sin(TA),-sin(TA),cos(TA))*t.xz;
 vec2 r=vec2(bx(q-vec3(0.,1.1,3.2),vec3(1.1,.6,1.1)),2.);
 r=U2(r,vec2(cy(vec2(q.y-.6,q.z-3.2),.6,abs(q.x)-1.3,.3),4.));
 r=U2(r,vec2(cp(t,vec3(0.,1.5,-5.5),vec3(0.,1.5,0.),1.2),3.));
 r=U2(r,vec2(bx(t-vec3(0.,.7,-3.),vec3(1.,.3,3.)),2.));
 r=U2(r,vec2(cy(vec2(t.y-.6,t.z+3.2),.6,abs(t.x)-1.3,.3),4.));
 return r;
}
// war-rig, local to its base: body, cab, spikes, wheels, exhaust stack
vec2 pu(vec3 q){
 vec2 r=vec2(bx(q-vec3(0.,1.35,0.),vec3(1.4,.55,2.6)),2.);
 r=U2(r,vec2(bx(q-vec3(0.,2.2,1.4),vec3(1.2,.45,1.2)),2.));
 vec3 s=q-vec3(0.,1.3,0.);s.z=mod(s.z+1.3,2.6)-1.3;
 r=U2(r,vec2(max(bx(s,vec3(1.9,.07,.07)),abs(q.z)-2.6),5.));
 r=U2(r,vec2(cy(vec2(q.y-.55,q.z+1.6),.55,abs(q.x)-1.5,.35),4.));
 r=U2(r,vec2(cy(vec2(q.y-.55,q.z-1.6),.55,abs(q.x)-1.5,.35),4.));
 r=U2(r,vec2(max(length(q.xz-vec2(1.2,-2.3))-.12,abs(q.y-2.6)-1.2),5.));
 return r;
}
// bounding sphere first, full vehicle only when close
vec2 vv(vec2 r,vec3 q,vec3 c,float rad,float k){
 float b=length(q-c)-rad;
 if(b>1.){r.x=min(r.x,b);return r;}
 return U2(r,k>.5?tk(q):pu(q));
}
// ids: 0 ground, 2 rust, 3 white tank, 4 tyre, 5 steel, 6 harpoon line
vec2 map(vec3 p){
 vec2 r=vec2(.7*(p.y-gh(p.xz)),0.);
 r=vv(r,p-TP,vec3(0.,1.5,-1.5),7.,1.);
 r=vv(r,p-P0,vec3(0.,1.5,0.),4.5,0.);
 r=vv(r,p-P1,vec3(0.,1.5,0.),4.5,0.);
 r=vv(r,p-P2,vec3(0.,1.5,0.),4.5,0.);
 if(HL>.5)r=U2(r,vec2(cp(p,HA,HB,.05),6.));
 return r;
}
float mt(vec3 ro,vec3 rd,float tm,out float id){
 float t=.05;id=0.;
 for(int i=0;i<160;i++){vec2 h=map(ro+rd*t);if(h.x<.001*t){id=h.y;return t;}t+=h.x;if(t>tm)break;}
 return 1e4;
}
vec3 nrm(vec3 p){vec2 e=vec2(.003,0.);return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x));}
float shd(vec3 p){float r=1.,t=.08;for(int i=0;i<22;i++){float h=map(p+SD*t).x;r=min(r,8.*h/t);t+=clamp(h,.15,2.5);if(t>40.)break;}return clamp(r,0.,1.);}
// dust density: soft blobs at the vehicles, plus the smoke of the blast
float dn(vec3 p){
 float s=0.;
 for(int k=0;k<4;k++){vec4 c=DS[k];vec3 q=p-c.xyz;q.y*=1.6;s+=DA[k]*exp(-dot(q,q)/(c.w*c.w));}
 vec3 e=p-EXP;s+=EI*exp(-dot(e,e)/(EQ*EQ*2.))*.6;
 return DU*(.45*s+.02*exp(-max(p.y,0.)*.6));
}
// emitters: exhaust flames, blast fireball, weld sparks
vec3 gg(vec3 p){
 vec3 g=vec3(0.);
 for(int k=0;k<4;k++){vec3 q=p-EX[k];g+=vec3(1.,.42,.1)*exp(-dot(q,q)*2.)*(.6+.4*sin(T*40.+float(k)*2.));}
 vec3 e=p-EXP;g+=EI*vec3(1.,.5,.15)*exp(-dot(e,e)/(EQ*EQ)*1.5)*1.6;
 vec3 q=p-SK;g+=SKI*vec3(1.,.6,.25)*exp(-dot(q,q)*.5)*(.5+.5*fract(sin(dot(p,vec3(12.9,78.2,37.1))+T*60.)*43758.5));
 return g;
}
vec3 vol(vec3 ro,vec3 rd,float tm,out float tr){
 vec3 acc=vec3(0.);tr=1.;float tp=0.;
 vec3 lc=mix(vec3(.5,.3,.2),vec3(1.,.7,.4),.5+.5*dot(rd,SD));
 for(int i=1;i<=28;i++){
  float t=tm*pow(float(i)/28.,2.);
  float dt=t-tp;tp=t;
  vec3 p=ro+rd*(t-.5*dt);
  float d=dn(p)*dt;
  acc+=tr*(1.-exp(-d))*lc;tr*=exp(-d);
  acc+=tr*gg(p)*dt;
 }
 return acc;
}
vec3 sky(vec3 rd){
 float s=max(dot(rd,SD),0.);
 vec3 c=mix(HZ*1.1,vec3(.14,.2,.3),smoothstep(0.,.45,rd.y));
 return c+vec3(1.,.6,.25)*pow(s,5.)*.6+vec3(1.,.9,.7)*pow(s,300.)*4.;
}
vec3 shade(vec3 p,vec3 n,float id,vec3 rd){
 vec3 a;
 if(id<.5){
  vec3 c=abs(p.x)>14.?vec3(.8,.46,.27)*(.85+.15*sin(p.z*.3)):vec3(.93,.88,.8);
  float cr=abs(sin(p.x*.8+sin(p.z*.45)*2.5)*sin(p.z*.6+sin(p.x*.5)*2.));
  a=c*(.8+.2*smoothstep(0.,.25,cr));
 }
 else if(id<2.5)a=vec3(.5,.22,.1)*(.7+.3*sin(p.y*30.+p.z*4.));
 else if(id<3.5)a=abs(p.y-TP.y-1.5)<.2?vec3(.6,.08,.04):vec3(.85,.84,.78);
 else if(id<4.5)a=vec3(.05);
 else a=vec3(.3,.3,.32);
 float d=max(dot(n,SD),0.)*shd(p+n*.02);
 vec3 sun=vec3(1.,.6,.32)*2.4,amb=vec3(.4,.38,.42)*.45*(.6+.4*n.y);
 vec3 c=a*(sun*d+amb);
 c+=sun*pow(max(dot(n,normalize(SD-rd)),0.),40.)*.15*step(1.5,id);
 return c;
}
void main(){
 vec2 fc=gl_FragCoord.xy;
 vec2 uv=(fc-.5*R)/R.y;
 // heat haze: the ray wobbles near the ground
 float hw=smoothstep(.15,-.35,uv.y);
 vec3 rd=normalize(uv.x*M[0]+uv.y*M[1]+FF*M[2]);
 rd=normalize(rd+M[0]*hw*.0035*sin(uv.y*160.+T*9.+sin(uv.x*25.)*3.));
 float id;
 float t=mt(CP,rd,1300.,id);
 vec3 col;
 if(t<1300.){vec3 p=CP+rd*t;col=shade(p,nrm(p),id,rd);col=mix(col,HZ,1.-exp(-t*.0025));}
 else col=sky(rd);
 float tr;
 vec3 vo=vol(CP,rd,min(t,1300.),tr);
 col=col*tr+vo;
 // lens ghosts along the line from the frame centre through the low sun
 float fr=dot(SD,M[2]);
 vec2 s=FF*vec2(dot(SD,M[0]),dot(SD,M[1]))/max(fr,.01);
 float fl=0.;
 for(int i=0;i<4;i++){float a=float(i)*.45-.5;vec2 d=uv-s*a;fl+=exp(-dot(d,d)*(700.+300.*float(i)))*(.4-.08*float(i));}
 col+=fl*vec3(1.,.72,.45)*smoothstep(0.,.3,fr)*1.5;
 // orange/teal grade, filmic curve, vignette, grain
 float l=dot(col,vec3(.3,.59,.11));
 col=mix(col*vec3(.7,1.02,1.1)+vec3(0.,.03,.05),col*vec3(1.12,.96,.8),smoothstep(.1,.8,l));
 col=1.-exp(-col*1.25);
 col*=1.-.35*dot(uv,uv);
 col+=(fract(sin(dot(fc+T*61.,vec2(12.9898,78.233)))*43758.5453)-.5)*.05;
 O=vec4(clamp(col,0.,1.),1.);
}
</script>
<script>// RUST CONVOY - soundtrack. 96 BPM, 42 bars (105 s) plus a tail. The same scheduler runs live and offline.
var SONG=(()=>{
const BPM=96,BEAT=60/BPM,BAR=4*BEAT,BARS=42,LEN=BARS*BAR+3;
const ss=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const K=(k,t)=>{let i=0;while(i<k.length-2&&t>k[i+1][0])i++;const a=k[i],b=k[i+1];return a[1]+(b[1]-a[1])*ss(a[0],b[0],t)};
const mf=m=>440*2**((m-69)/12);
// tanker speed (units/s), and the time warp that stretches the canyon hang (real time 61-69 s)
const VK=[[0,8],[9,18],[20,26],[34,34],[49,36],[60,38],[67,36],[72,0],[999,0]];
const WARP=t=>1-.8*ss(61,63,t)*(1-ss(67,69,t));
const SPD=t=>K(VK,t)*WARP(t);
// distance travelled by the convoy, integrated once in 10 ms steps
const ZT=new Float32Array(LEN*100+3);for(let i=1;i<ZT.length;i++)ZT[i]=ZT[i-1]+SPD((i-1)*.01)*.01;
const Z=t=>{const x=Math.max(0,t)*100,i=Math.min(x|0,ZT.length-2);return ZT[i]+(ZT[i+1]-ZT[i])*(x-(x|0))};
// builds the graph on ctx with song time 0 at context time `base`; returns sched(bar)
function setup(A,base){
 const SR=A.sampleRate;let bag=[];const BAGS=[],keep=n=>(bag.push(n),n);
 const G=(v,...to)=>{const g=keep(A.createGain());g.gain.value=v;to.forEach(n=>g.connect(n));return g};
 const F=(type,f,q,...to)=>{const x=keep(A.createBiquadFilter());x.type=type;x.frequency.value=f;x.Q.value=q;to.forEach(n=>x.connect(n));return x};
 const SH=k=>{const w=A.createWaveShaper(),c=new Float32Array(512);for(let i=0;i<512;i++){const x=i/255.5-1;c[i]=Math.tanh(k*x)/Math.tanh(k)}w.curve=c;return w};
 let sd=5;const rnd=()=>(sd=sd*16807%2147483647)/2147483647*2-1;
 const NB=A.createBuffer(1,SR*2|0,SR),nd=NB.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=rnd();
 const IR=A.createBuffer(2,SR*3|0,SR);for(let c=0;c<2;c++){const d=IR.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=rnd()*(1-i/d.length)**3}
 // ---- long-lived master chain ----
 const comp=A.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=6;comp.attack.value=.002;comp.connect(A.destination);
 const master=G(.27,comp);
 master.gain.setValueAtTime(0,base+63);master.gain.setValueAtTime(.27,base+67.5);   // the canyon hang is silent
 master.gain.setValueAtTime(.27,base+101);master.gain.linearRampToValueAtTime(0,base+LEN);
 const rev=A.createConvolver();rev.buffer=IR;rev.connect(G(.5,master));
 const dsh=SH(4);dsh.connect(master);const dIn=G(.9,dsh);                 // distorted tribal drums
 const gsh=SH(12),gtr=F('lowpass',2400,.7,master,rev);gsh.connect(gtr);     // distorted saw lead
 const bp=F('lowpass',380,2,master,rev);                                    // pulse bass
 const pf=F('lowpass',800,.5,master,rev);                                   // end pad
 // engine drone: three oscillators whose pitch follows the tanker's speed (sampled every 1/4 s)
 const dsh2=SH(2);dsh2.connect(master);const dlp=F('lowpass',200,3,dsh2),dg=G(0,dlp);
 const os=[0,1,2].map(i=>{const o=A.createOscillator();o.type=i==2?'sine':'sawtooth';o.detune.value=i*9;o.connect(dg);o.start(base);o.stop(base+LEN);return o});
 os.forEach(o=>o.frequency.setValueAtTime(34,base));dlp.frequency.setValueAtTime(200,base);
 for(let s=0;s<=LEN;s+=.25){const f=34+.8*SPD(s);os.forEach(o=>o.frequency.linearRampToValueAtTime(f,base+s));dlp.frequency.linearRampToValueAtTime(160+10*SPD(s),base+s)}
 dg.gain.setValueAtTime(0,base);dg.gain.linearRampToValueAtTime(.22,base+6);dg.gain.setValueAtTime(.22,base+62);
 dg.gain.linearRampToValueAtTime(.32,base+70);dg.gain.setValueAtTime(.32,base+80);dg.gain.linearRampToValueAtTime(.12,base+92);dg.gain.linearRampToValueAtTime(0,base+LEN-2);
 bag=[];
 // ---- one-shot voices (all land in the bag of the bar that schedules them) ----
 function drum(t,f0,f1,dec,v){const o=keep(A.createOscillator()),e=G(0,dIn);o.connect(e);
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dec*.4);
  e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.001,t+dec);o.start(t);o.stop(t+dec+.05)}
 function hit(t,dur,f,q,v,type,to){const s=keep(A.createBufferSource()),e=G(0,to||master),x=F(type||'bandpass',f,q,e);
  s.buffer=NB;s.connect(x);e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.001,t+dur);s.start(t,Math.abs(rnd())*1.5);s.stop(t+dur+.05)}
 function lead(t,m,d,v){const e=G(0,gsh);[0,1].forEach(i=>{const o=keep(A.createOscillator());o.type='sawtooth';o.frequency.value=mf(m)*(1+i*.004);o.connect(e);o.start(t);o.stop(t+d+.05)});
  e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(v,t+.02);e.gain.setValueAtTime(v,t+d*.75);e.gain.linearRampToValueAtTime(0,t+d)}
 function pluck(t,m,d,v){const e=G(0,bp),o=keep(A.createOscillator());o.type='sawtooth';o.frequency.value=mf(m);o.connect(e);o.start(t);o.stop(t+d+.05);
  e.gain.setValueAtTime(v,t);e.gain.exponentialRampToValueAtTime(.001,t+d)}
 function pad(t,ms,d,v){ms.forEach(m=>[-8,8].forEach(c=>{const e=G(0,pf),o=keep(A.createOscillator());o.type='sawtooth';o.frequency.value=mf(m);o.detune.value=c;o.connect(e);o.start(t);o.stop(t+d+.05);
  e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(v,t+1.5);e.gain.linearRampToValueAtTime(0,t+d)}))}
 function bell(t,m,v){[1,2.76,5.4].forEach((r,i)=>{const e=G(0,master,rev),o=keep(A.createOscillator());o.frequency.value=mf(m)*r;o.connect(e);o.start(t);o.stop(t+5);
  e.gain.setValueAtTime(v/(i+1),t);e.gain.exponentialRampToValueAtTime(.001,t+4/(i+1))})}
 function boom(t){const e=G(0,master,rev),o=keep(A.createOscillator());o.connect(e);o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(22,t+2.5);o.start(t);o.stop(t+3.6);
  e.gain.setValueAtTime(1.2,t);e.gain.exponentialRampToValueAtTime(.001,t+3.4);hit(t,2.8,500,.6,.7,'lowpass')}
 function riser(t,d){const s=keep(A.createBufferSource()),e=G(0,master,rev),x=F('bandpass',300,3,e);s.buffer=NB;s.loop=true;s.connect(x);s.start(t);s.stop(t+d+.05);
  x.frequency.setValueAtTime(300,t);x.frequency.exponentialRampToValueAtTime(5000,t+d);e.gain.setValueAtTime(.001,t);e.gain.exponentialRampToValueAtTime(.4,t+d)}
 // ---- arrangement, bar by bar ----
 const RF=[62,62,65,67,69,67,65,62,60,60,62,65,67,65,64,62];
 function bar(b,t){const B=x=>t+x*BEAT,K1=x=>drum(B(x),120,40,.45,.9),T1=x=>drum(B(x),200,95,.22,.5),S1=x=>hit(B(x),.04,6500,.8,.12),SP=x=>hit(B(x),.25,3200,5,.25);
  if(b>=2&&b<4){K1(0);K1(2);T1(3.5)}                                             // 1: tanker alone, a few drums
  if(b>=4&&b<8){K1(0);T1(1);K1(2);T1(3);for(let x=0;x<4;x+=.5)S1(x)}              // 2: dust plume, shaker
  if(b>=8&&b<14){const P=[38,38,41,38,36,38,41,38];for(let x=0;x<4;x++){K1(x);T1(x+.5)}for(let k=0;k<8;k++)pluck(B(k*.5),P[k],.4,.3)} // 3: pack closes in
  if(b>=14&&b<20){K1(0);K1(2);T1(1.5);T1(3);for(let k=0;k<8;k++)lead(B(k*.5),RF[(b%2)*8+k],.3,.2);if(b%2){SP(1.5);SP(3.25)}} // 4: boarding, sparks
  if(b==20){riser(t,BAR*3);lead(t,62,BAR*2.8,.22)}                              // 5: harpoon line
  if(b>=20&&b<23){K1(0);K1(2);for(let x=0;x<4;x+=.25)T1(x)}
  if(b>=23&&b<25){for(let x=0;x<4;x+=.5)K1(x);T1(1);T1(3)}                       // 6: the run-up to the canyon
  if(b>=25&&b<27)return;                                                         // 6: hang, silent
  if(b==27){boom(t);hit(t,3,7000,.6,.3,'highpass');lead(t,74,BAR*1.8,.25)}       // 7: jackknife, blast
  if(b>=27&&b<31){for(let x=0;x<4;x++)K1(x);T1(.5);T1(2.5)}
  if(b>=31&&b<36){K1(0);if(b%2)T1(2)}                                            // 8: dust, quiet
  if(b==36){pad(t,[50,53,57,60,64],BAR*4,.12);bell(t,74,.2)}                     // 8: end card
  if(b==38)bell(t,77,.15);
 }
 function sched(b){bag=[];if(b>4&&BAGS[b-5]){BAGS[b-5].forEach(n=>n.disconnect());BAGS[b-5]=0}BAGS[b]=bag;bar(b,base+b*BAR)}
 sched.out=comp;return sched}
// live: schedule each bar ~1.2 s before it plays, so sound starts within a second of the click
function live(A,from=0){const base=A.currentTime+.15-from,sched=setup(A,base);let b=Math.ceil(from/BAR-.001);
 const tick=()=>{while(b<BARS&&base+b*BAR<A.currentTime+1.2)sched(b++)};tick();const iv=setInterval(tick,100);
 return{base,stop(){clearInterval(iv);sched.out.disconnect()}}}
// offline: same code, bars injected via suspend() so the graph stays small
function render(){const SR=44100,A=new OfflineAudioContext(2,SR*LEN|0,SR),sched=setup(A,0);sched(0);
 for(let b=1;b<BARS;b++)A.suspend(((b*BAR-.5)*SR/128|0)*128/SR).then(()=>{sched(b);A.resume()});
 return A.startRendering()}
return{live,render,Z,SPD,K,ss,BAR,LEN,BARS}})();
</script>
<script>(()=>{
const{K,ss,Z,LEN}=SONG,$=s=>document.getElementById(s),cv=$('c'),ti=$('ti'),en=$('en');
const gl=cv.getContext('webgl2',{antialias:false,depth:false,powerPreference:'high-performance'});
if(!gl){document.body.innerHTML='<p style="color:#eee;font:20px sans-serif;padding:2em">WebGL2 is required.</p>';return}
const ZC=Z(65),ZA=ZC-18,ZB=ZC+18,TE=67.5;                 // canyon centre is where the convoy is at 65 s
const arc=z=>z>ZA&&z<ZB?8*Math.sin(Math.PI*(z-ZA)/(ZB-ZA)):0;   // jump arc over the canyon
// ---- keys: [time s, value] ----
const CXK=[[0,0],[6,.5],[12,-1.2],[18,1.2],[24,-.5],[30,0],[36,.3],[46,-.3],[52,0],[57,.6],[62,-.3],[68,.6],[74,-2],[82,2.5],[92,0],[105,1]];
const CYK=[[0,.8],[60,.9],[65,1.6],[70,2.5],[80,3.2],[105,4]];
const CZK=[[0,7],[30,7],[36,12],[62,12],[68,7],[75,13],[105,30]];
const YK=[[0,0],[7,0],[10,3.1416],[33,3.1416],[37,.25],[42,-.2],[50,0],[56,.2],[62,-.12],[67,0],[70,0],[105,-.05]];
const P0X=[[0,0],[30,0],[36,-3.6],[60,-3.6],[72,-15],[105,-40]];
const P0G=[[0,800],[9,640],[20,200],[26,40],[34,12],[40,4],[50,3],[56,5],[70,18],[72,40],[105,60]];
const P1X=[[0,0],[32,0],[38,3.6],[58,2],[70,2],[74,12],[105,30]];
const P1G=[[0,900],[10,760],[20,220],[30,50],[36,14],[40,3.5],[52,3.5],[58,6],[72,30],[105,80]];
const P2G=[[0,1000],[10,820],[20,340],[30,120],[40,30],[50,22],[60,18],[70,25],[105,250]];
// world state at time t: tanker, three pursuers as [x, y, z, gap]
function rig(t){
 const tz=Z(t),tx=-.6*ss(51,53,t);
 const P=[[K(P0X,t),K(P0G,t)],[K(P1X,t),K(P1G,t)],[0,K(P2G,t)]].map(([x,g])=>[x,arc(tz-g),tz-g,g]);
 return{tz,tx,ty:arc(tz),P};
}
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const nrm3=a=>{const l=Math.hypot(...a);return a.map(v=>v/l)};
// chase camera: wheel height behind the tanker, yaw swoops, side tracking, micro shake
function view(t){
 const r=rig(t),yaw=K(YK,t),pit=-.05+.02*Math.sin(t*1.9),sh=.035*Math.sin(t*23.1)*(1+4*ss(62,68,t));
 const p=[r.tx+K(CXK,t)+sh,r.ty+K(CYK,t)+sh*.5,r.tz-K(CZK,t)];
 const f=[Math.sin(yaw)*Math.cos(pit),Math.sin(pit),Math.cos(yaw)*Math.cos(pit)];
 const rr=nrm3(cross(f,[0,1,0])),uu=cross(rr,f);
 return{p,f,rr,uu,r};
}
// per-frame effects: harpoon, sparks, blast, exhausts and dust sources
function fx(t,r){
 const P=r.P,hp=ss(50,51.5,t),A=[P[0][0]+1.8,P[0][1]+1.6,P[0][2]],Bt=[r.tx-1.8,r.ty+1.2,r.tz+.5];
 const DS=[[r.tx,r.ty+.6,r.tz-3,3],...P.map(([x,y,z,g])=>[x,y+1.2,z,2.5+.035*g])];
 const DA=[.5*(1-ss(.2,1.5,r.ty)),...P.map(([,,,g])=>(.03+.4*(1-ss(40,400,g)))*ss(5,10,t))];
 return{
  HA:A,HB:A.map((a,i)=>a+(Bt[i]-a)*hp),HL:ss(49.5,50,t)*(1-ss(59,60,t)),
  SK:[r.tx+1.9,r.ty+1,r.tz-3.2],SKI:ss(35,36,t)*(1-ss(49,50,t))*(.6+.4*Math.sin(t*31)),
  EXP:[r.tx,r.ty+2+Math.max(0,t-TE)*2.4,r.tz],EQ:1+5*ss(TE,TE+4,t),EI:ss(TE,TE+.15,t)*(1-.5*ss(85,105,t)),
  TA:1.1*ss(TE,TE+3.5,t),
  DS,DA,EX:[...P.map(([x,y,z])=>[x+1.2,y+2.9,z-2.3]),[r.tx+1,r.ty+2.9,r.tz+3.3]]
 };
}
// ---- GL ----
const VS='#version 300 es\nvoid main(){gl_Position=vec4(vec2(gl_VertexID&1,gl_VertexID>>1)*4.-1.,0,1);}';
function prog(vs,fs){const p=gl.createProgram();for(const[ty,src]of[[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]]){const s=gl.createShader(ty);
  gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));gl.attachShader(p,s)}
 gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(p));
 const U={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);U[a.name]=gl.getUniformLocation(p,a.name)}return{p,U}}
const{p:PR,U}=prog(VS,$('fs').textContent);
let sc=1,ema=16,last=performance.now(),fr=0;
function size(){const w=innerWidth,h=innerHeight,k=Math.min(devicePixelRatio||1,1)*sc*Math.min(1,1152/w);cv.width=w*k|0;cv.height=h*k|0}
addEventListener('resize',size);size();
// ---- clock and start ----
let actx=null,song=null;
async function go(){if(song)return;ti.style.opacity=0;ti.style.filter='blur(8px)';actx=new AudioContext();await actx.resume();song=SONG.live(actx,0)}
addEventListener('pointerdown',go);addEventListener('keydown',e=>{if(e.key==' '||e.key=='Enter')go()});
// clearance probe: the camera is tested against the vehicles at the time it was last sampled
let lastT=0;
window.__probe={dur:LEN,cam:t=>(lastT=t,view(t).p),get boxes(){const r=rig(lastT);
 return[[r.tx-2,r.ty,r.tz-5.5,r.tx+2,r.ty+3.1,r.tz+6],...r.P.map(([x,y,z])=>[x-1.8,y,z-2.8,x+1.8,y+2.9,z+2.8])]}};
// ---- frame ----
const u1=(n,x)=>gl.uniform1f(U[n],x),u3=(n,a)=>gl.uniform3fv(U[n],a);
function frame(){
 requestAnimationFrame(frame);
 const pn=performance.now();
 ema=ema*.95+(pn-last)*.05;last=pn;if(++fr>90&&ema>34&&sc>.5){sc*=.85;size();ema=20;fr=0}
 const t=song?Math.min(LEN,Math.max(0,actx.currentTime-song.base)):0;
 const v=view(t),r=v.r,e=fx(t,r),SD=nrm3([.42,.3-.2*ss(60,105,t),1]);
 gl.viewport(0,0,cv.width,cv.height);gl.useProgram(PR);
 gl.uniform2f(U.R,cv.width,cv.height);
 u1('T',pn/1000);u1('ZC',ZC);u1('DU',1+.8*ss(78,100,t));u1('HL',e.HL);u1('SKI',e.SKI);u1('EQ',e.EQ);u1('EI',e.EI);u1('TA',e.TA);
 u3('CP',v.p);u3('TP',[r.tx,r.ty,r.tz]);u3('P0',r.P[0].slice(0,3));u3('P1',r.P[1].slice(0,3));u3('P2',r.P[2].slice(0,3));
 u3('SD',SD);u3('HA',e.HA);u3('HB',e.HB);u3('SK',e.SK);u3('EXP',e.EXP);
 gl.uniformMatrix3fv(U.M,false,[...v.rr,...v.uu,...v.f]);
 gl.uniform4fv(U['DS[0]'],e.DS.flat());gl.uniform4fv(U.DA,e.DA);gl.uniform3fv(U['EX[0]'],e.EX.flat());
 gl.drawArrays(gl.TRIANGLES,0,3);
 en.style.opacity=ss(89,97,t);
}
frame();
})();
</script>
</body></html>
