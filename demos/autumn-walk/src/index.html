<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>a little autumn walk</title>
<style>
html,body{margin:0;height:100%;background:#120a06;overflow:hidden;color:#fff4e2;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.jp,#st h1,#end .j{font-family:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif CJK JP","Noto Serif JP","Source Han Serif JP","IPAexMincho","MS Mincho",serif}
.en,#st p,#end{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif}
.hk{position:fixed;top:11vh;display:none;gap:3vmin;align-items:flex-start;pointer-events:none;
 text-shadow:0 0 .5em #2b1206,0 0 1.2em #2b1206,0 .06em .12em #000,0 0 2.4em rgba(30,10,0,.7)}
.hk.r{right:7vw;flex-direction:row-reverse}.hk.l{left:7vw}
.hk.t{left:50%;top:50%;transform:translate(-50%,-55%);flex-direction:column;align-items:center;gap:2.5vmin}
.hk span{display:block;opacity:0}
.jp{writing-mode:vertical-rl;font-size:4vmin;line-height:1.75;letter-spacing:.22em;font-weight:500}
.en{font-style:italic;font-size:2.8vmin;line-height:1.75;letter-spacing:.02em;padding-top:.6vmin;max-width:34vmin}
.hk.r .en{text-align:right}
.hk.t .jp{writing-mode:horizontal-tb;font-size:8vmin;letter-spacing:.35em;padding-left:.35em}
.hk.t .en{font-size:3vmin;letter-spacing:.3em;max-width:none}
#end{position:fixed;left:3vw;width:50vw;top:50%;transform:translateY(-55%);display:none;flex-direction:column;align-items:center;pointer-events:none;
 text-shadow:0 0 .4em #3a1604,0 0 1.2em #3a1604,0 0 3em rgba(255,150,60,.35)}
#end>*{opacity:0;margin:0}
#end .j{font-size:3.6vmin;letter-spacing:.45em;padding-left:.45em}
#end .h{font-style:italic;font-size:9vmin;line-height:1.1;margin-top:1vmin;color:#ffe9c4}
#end .m{font-size:15vmin;line-height:1;letter-spacing:.08em;color:#ffd79a;text-shadow:0 0 .3em #4a1c04,0 0 .9em rgba(255,140,40,.55),0 0 2em rgba(255,120,30,.4)}
#end .s{font-style:italic;font-size:2.4vmin;letter-spacing:.2em;margin-top:2vmin}
#end .x{margin-top:5vh;font-size:2vmin;letter-spacing:.3em;color:#e9c9a0}
#st{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity 1.2s;
 background:radial-gradient(ellipse at 50% 55%,rgba(40,16,4,.05),rgba(18,8,3,.75));text-shadow:0 0 .6em #2b1206,0 0 1.5em #2b1206}
#st h1{writing-mode:vertical-rl;font-size:8vmin;font-weight:500;letter-spacing:.3em;margin:0 0 3vmin}
#st p{margin:.6vmin;font-style:italic;font-size:2.8vmin;letter-spacing:.25em}
#st .c{font-style:normal;font-size:1.9vmin;letter-spacing:.4em;margin-top:4vmin;opacity:.85;animation:b 2.4s ease-in-out infinite}
#st .e{width:1.4vmin;height:1.4vmin;border-radius:50%;background:#ffb35c;box-shadow:0 0 1.5vmin #ff9a3c,0 0 4vmin #ff7a1c;margin-top:3vmin;animation:b 1.6s ease-in-out infinite}
@keyframes b{50%{opacity:.35}}
</style></head><body>
<canvas id="c"></canvas><div id="cap"></div>
<div id="end"><p class="j">お誕生日おめでとう</p><p class="h">Happy Birthday</p><p class="m">Mika</p><p class="s">from a little fox, with love</p><p class="x">click to walk again</p></div>
<div id="st"><h1>秋の小径</h1><p>a little autumn walk</p><div class="e"></div><p class="c">click to begin · sound on</p></div>
<script>/*MUSIC*/</script>
<script>/*MAIN*/</script>
</body></html>
